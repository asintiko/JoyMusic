<!doctype html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0812" />
    <title>Joy Music</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0a0812;
        color: #f5f2ff;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      main {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 32px;
        text-align: center;
        background: radial-gradient(ellipse at 50% 15%, rgba(122, 92, 255, 0.34), transparent 62%);
      }
      .mark {
        width: 72px;
        height: 72px;
        border-radius: 22px;
        background: linear-gradient(135deg, #7a5cff, #ff4fd8);
        display: grid;
        place-items: center;
        font-weight: 800;
        font-size: 34px;
      }
      h1 {
        margin: 8px 0 0;
        font-size: 22px;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0;
        max-width: 30ch;
        color: #b8b0d9;
        font-size: 15px;
        line-height: 1.45;
      }
      button {
        margin-top: 10px;
        height: 48px;
        padding: 0 26px;
        border: 0;
        border-radius: 999px;
        background: #f5f2ff;
        color: #0a0812;
        font-size: 15px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">J</div>
      <h1>Aloqa yoʻq · Нет связи · No connection</h1>
      <p>Internetni tekshiring · Проверьте интернет · Check your internet</p>
      <button type="button" onclick="location.reload()">↻</button>
    </main>
  </body>
</html>
